server {
    listen 8080;
    host 127.0.0.1;
    server_name webserv.local;

    root ./www/html;
    index index.html;

    location / {
        allow_methods GET;
        autoindex off;
    }
}

server {
    listen 8080;
    host 127.0.0.1;
    server_name webserv.local;

    root ./www/cgi-bin;

    location / {
        allow_methods GET POST;
    }
}
