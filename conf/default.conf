server {
    listen 8080;
    host 127.0.0.1;
    server_name webserv.local;

    root ./www;
    index index.html;
    client_max_body_size 10M;

    error_page 404 errors/404.html;
    error_page 500 502 503 504 errors/50x.html;

    location / {
        allow_methods GET;
        root ./www/html;
        index index.html;
        autoindex off;
    }

    location /images {
        allow_methods GET;
        root ./www/;
        autoindex on;       # If no index.html is found, list the files
    }

    location /upload {
        allow_methods GET POST DELETE;
        upload_store ./www/upload;
    }

    location /old-page {
        return 301 /index.html;
    }

    location /cgi-bin {
        allow_methods GET POST;
        # cgi_path ./www/cgi-bin; 
        # cgi_ext 
    }
}
