server {
    listen 8080;
    host 127.0.0.1;
    server_name webserv.local;

    root ./www/html;
    index index.html;
    client_max_body_size 10M;

    error_page 404 errors/404.html;
    error_page 500 502 503 504 errors/50x.html;

    location / {
        allow_methods GET;
        root ./www/html;
        index index.html;
        autoindex off;
    }

    location /images {
        allow_methods GET;
        root ./www/;
        autoindex on;       # If no index.html is found, list the files
    }

    location /upload {
        allow_methods GET POST DELETE;
        upload_store ./www/upload;
    }

    location /old-page {
        return 301 /index.html;
    }
}


server {
    listen 8081;
    host 127.0.0.1;
    server_name cgi.local;

    root ./www/cgi-bin;
    client_max_body_size 10M;

    location ~ \.php$ {
        allow_methods GET POST;
        cgi_pass /usr/bin/php-cgi; # Path to the PHP interpreter on your machine
    }

    location ~ \.py$ {
        allow_methods GET POST;
	cgi_ext .py;
        cgi_pass /usr/bin/python3; # Path to the Python interpreter
    }
}
