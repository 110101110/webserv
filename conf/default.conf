# webserv.conf

# ---------------------------------------------------------
# SERVER 1: The Main Website (Static files & Uploads)
# ---------------------------------------------------------
server {
    listen 8080;
    host 127.0.0.1;
    server_name webserv.local;

    # Global settings for this server
    root ./www/html;
    index index.html;
    client_max_body_size 5M; # Limit uploads to 5 Megabytes

    # Custom error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    # Route 1: The homepage
    location / {
        allow_methods GET;
        autoindex off;
    }

    # Route 2: A directory with listing enabled
    location /images {
        allow_methods GET;
        root ./www/images;
        autoindex on;       # If no index.html is found, list the files
    }

    # Route 3: Upload directory (allows POST)
    location /upload {
        allow_methods GET POST DELETE;
        upload_store ./www/uploads; # Where to save uploaded files
    }

    # Route 4: HTTP Redirection
    location /old-page {
        return 301 /index.html;
    }
}

# ---------------------------------------------------------
# SERVER 2: The Application Server (CGI Testing)
# ---------------------------------------------------------
server {
    listen 8081;
    host 127.0.0.1;
    server_name cgi.local;

    root ./www/cgi-bin;
    client_max_body_size 10M;

    # Route 1: PHP Scripts
    location ~ \.php$ {
        allow_methods GET POST;
        cgi_pass /usr/bin/php-cgi; # Path to the PHP interpreter on your machine
    }

    # Route 2: Python Scripts
    location ~ \.py$ {
        allow_methods GET POST;
        cgi_pass /usr/bin/python3; # Path to the Python interpreter
    }
}
