server {
    listen 8080;
    host 127.0.0.1;
    server_name webserv.local;

    root ./www;
    index index.html;
    client_max_body_size 10M;

    error_page 400 html/errors/400.html;
    error_page 403 html/errors/403.html;
    error_page 404 html/errors/404.html;
    error_page 405 html/errors/405.html;
    error_page 413 html/errors/413.html;
    error_page 500 html/errors/500.html;
    error_page 501 html/errors/501.html;
    error_page 502 html/errors/502.html;
    error_page 503 html/errors/503.html;
    error_page 504 html/errors/504.html;
    error_page 505 html/errors/505.html;


    location / {
        allow_methods GET;
        root ./www/html;
        index index.html;
        autoindex off;
    }

    location /images {
        allow_methods GET;
        root ./www/;
        autoindex on;       # If no index.html is found, list the files
    }

    location /upload {
        allow_methods GET POST DELETE;
        upload_store ./www/upload;
    }

    location /old-page {
        return 301 /index.html;
    }

    location /cgi-bin {
        allow_methods GET POST;
        root ./www;
        cgi_ext .py;
        cgi_path /usr/bin/python3;
    }
}

server {
    listen 8081;
    host 127.0.0.1;
    server_name inherit.test;

    # THE PARENT ROOT
    root ./www/global;
    index index.html;

    # Route 1: The Trap (Should inherit the parent root)
    location / {
        allow_methods GET;
        # Notice: No root defined here!
    }

    # Route 2: The Override (Should ignore the parent root)
    location /custom {
        allow_methods GET;
        root ./www/; # Explicitly overrides the parent
    }
}