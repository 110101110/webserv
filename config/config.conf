server { 
	listen 8080
	host 127.0.0.1
	server_name localhost
	client_max_body_size 1000000
	location / {
		root ./www
		methods GET POST
		autoindex on
	}
}

server {
	listen 8081
	host 127.0.0.1
	server_name localhost
	client_max_body_size 1000000
	location / {
		root ./www
		methods GET POST
		autoindex on
	}
}
