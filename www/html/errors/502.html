<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Webserv — 502 Bad Gateway</title>
    <style>
        :root { --red: #e50914; --bg: #141414; --surface: #181818; --text: #e5e5e5; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; overflow: hidden; }
        .hero-bg { position: absolute; inset: 0; background: linear-gradient(to top, rgba(20,20,20,1) 0%, rgba(20,20,20,0.4) 100%), url('/images/background.jpg') center/cover no-repeat; z-index: -1; opacity: 0.2; }
        .container { padding: 50px; border-left: 4px solid var(--red); background: rgba(24, 24, 24, 0.9); box-shadow: 0 20px 50px rgba(0,0,0,0.8); max-width: 500px; }
        h1 { font-size: 100px; margin: 0; color: var(--red); line-height: 1; }
        h2 { font-size: 24px; margin: 20px 0; text-transform: uppercase; letter-spacing: 2px; }
        p { color: #b3b3b3; font-size: 16px; margin-bottom: 35px; line-height: 1.6; }
        .btn { display: inline-block; background: var(--red); color: white; padding: 12px 30px; text-decoration: none; font-weight: bold; text-transform: uppercase; border-radius: 2px; }
    </style>
</head>
<body>
    <div class="hero-bg"></div>
    <div class="container">
        <h1>502</h1>
        <h2>Bad Gateway</h2>
        <p>The server received an invalid response from the upstream CGI script while attempting to fulfill the request.</p>
        <a href="/" class="btn">Return Home</a>
    </div>
</body>
</html>
