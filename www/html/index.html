<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Webserv — Home</title>
    <style>
        :root { 
            --red: #e50914; 
            --bg: #141414; 
            --surface: #181818; 
            --text: #e5e5e5; 
        }

        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            text-align: center; 
            overflow: hidden; 
        }

        /* L'effet de fond dégradé identique aux erreurs */
        .hero-bg { 
            position: absolute; 
            inset: 0; 
            background: linear-gradient(to top, rgba(20,20,20,1) 0%, rgba(20,20,20,0.4) 100%), 
                        url('/images/background.jpeg') center/cover no-repeat; 
            z-index: -1; 
            opacity: 0.2; 
        }

        .container { 
            padding: 60px; 
            border-left: 4px solid var(--red); 
            background: rgba(24, 24, 24, 0.9); 
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); 
            max-width: 600px; 
            backdrop-filter: blur(5px);
        }

        h1 { 
            font-size: 60px; 
            margin: 0; 
            color: var(--red); 
            letter-spacing: -2px;
            text-transform: uppercase;
        }

        h2 { 
            font-size: 20px; 
            margin: 10px 0 30px 0; 
            text-transform: uppercase; 
            letter-spacing: 4px; 
            color: #ffffff;
        }

        p { 
            color: #b3b3b3; 
            font-size: 18px; 
            margin-bottom: 40px; 
            line-height: 1.6; 
        }

        .nav-links {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn { 
            display: inline-block; 
            background: var(--red); 
            color: white; 
            padding: 12px 25px; 
            text-decoration: none; 
            font-weight: bold; 
            text-transform: uppercase; 
            border-radius: 2px; 
            transition: transform 0.2s, background 0.2s;
        }

        .btn:hover {
            background: #ff0f1a;
            transform: scale(1.05);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #b3b3b3;
        }

        .btn-outline:hover {
            background: rgba(255,255,255,0.1);
            border-color: white;
        }
    </style>
</head>
<body>
    <div class="hero-bg"></div>
    
    <div class="container">
        <h1>WEBSERV</h1>
        <h2>C++98 HTTP Server</h2>
        
        <p>
            Welcome to our custom-built web server.
        </p>

    </div>
</body>
</html>
